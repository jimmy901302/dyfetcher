<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>抖音直播弹幕抓取 🔴 实时弹幕抓取 💬 多类型消息支持</title>
  <meta name="description" content="抖音直播弹幕抓取系统，实时弹幕抓取，多类型消息支持，多直播间并发监控和数据采集。">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-adsense-account" content="ca-pub-9461577395918976">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MyWebSite" />
    <link rel="manifest" href="/site.webmanifest" />

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei",
        sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .container {
      width: 100%;
      max-width: 960px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 20px 24px 24px;
      transition: background 0.2s ease, border-color 0.2s ease,
        box-shadow 0.2s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
    }
    .status {
      font-size: 13px;
      color: #9ca3af;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #f97316;
      margin-right: 6px;
    }
    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
    }
    .input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.6);
    }
    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.08s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
    }
    .btn-secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #374151;
    }
    .btn-ghost {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #374151;
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }
    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
    }
    .hint code {
      padding: 2px 4px;
      border-radius: 4px;
      background: #111827;
      color: #e5e7eb;
    }
    .danmu-box {
      margin-top: 10px;
      background: radial-gradient(circle at top, #020617 0, #020617 35%, #020617 100%);
      border-radius: 12px;
      border: 1px solid #1f2937;
      padding: 10px 10px 6px;
      height: 420px;
      display: flex;
      flex-direction: column;
    }
    .danmu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .danmu-title {
      font-size: 14px;
      font-weight: 500;
    }
    .danmu-counter {
      font-size: 12px;
      color: #9ca3af;
    }
    .danmu-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      font-size: 13px;
      will-change: scroll-position;
      contain: layout paint;
    }
    .danmu-item {
      padding: 4px 6px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      min-width: 0;
    }
    .danmu-time {
      font-size: 11px;
      color: #6b7280;
      min-width: 90px;
    }
    .danmu-type {
      font-size: 11px;
      color: #38bdf8;
    }
    .danmu-user-id {
      font-size: 11px;
      color: #9ca3af;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .danmu-user {
      font-size: 12px;
      color: #fbbf24;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .danmu-content {
      font-size: 13px;
      color: #e5e7eb;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
      text-align: right;
    }

    .disclaimer {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      font-size: 11px;
      color: #f97316;
      line-height: 1.6;
    }
    
    body.light .disclaimer {
      background: rgba(249, 115, 22, 0.05);
      border-color: rgba(249, 115, 22, 0.2);
      color: #ea580c;
    }

    .stats-row {
      margin-top: 6px;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: #020617;
      border: 1px solid #1f2937;
    }

    .csv-box {
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #020617;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .csv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #9ca3af;
    }
    .csv-textarea {
      width: 100%;
      height: 200px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      background: #020617;
      color: #e5e7eb;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 6px 8px;
      outline: none;
    }

    /* 亮色模式覆盖 */
    body.light {
      background: #f3f4f6;
      color: #111827;
    }
    body.light .container {
      background: #ffffff;
      border-color: #e5e7eb;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
    }
    body.light .status {
      color: #4b5563;
    }
    body.light .hint {
      color: #6b7280;
    }
    body.light .hint code {
      background: #f3f4f6;
      color: #111827;
    }
    body.light .input {
      background: #ffffff;
      color: #111827;
      border-color: #d1d5db;
    }
    body.light .input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 1px rgba(79, 70, 229, 0.5);
    }
    body.light .btn-secondary {
      background: #f9fafb;
      color: #111827;
      border-color: #d1d5db;
    }
    body.light .btn-ghost {
      border-color: #d1d5db;
      color: #4b5563;
    }
    body.light .danmu-box {
      background: #f9fafb;
      border-color: #e5e7eb;
    }
    body.light .danmu-item {
      background: #ffffff;
    }
    body.light .danmu-time {
      color: #9ca3af;
    }
    body.light .danmu-type {
      color: #0284c7;
    }
    body.light .danmu-user {
      color: #b45309;
    }
    body.light .danmu-content {
      color: #111827;
    }
    body.light .footer {
      color: #9ca3af;
    }
    body.light .stat-pill {
      background: #f3f4f6;
      border-color: #e5e7eb;
    }
    body.light .csv-box {
      background: #f9fafb;
      border-color: #e5e7eb;
    }
    body.light .csv-textarea {
      background: #ffffff;
      color: #111827;
      border-color: #e5e7eb;
    }
    
    /* 滚动条优化 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
    body.light ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }
    body.light ::-webkit-scrollbar-thumb {
      background: #d1d5db;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 14px;
        border-radius: 12px;
      }
      .title {
        font-size: 18px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .status {
        flex: 1;
        min-width: 0;
        word-break: break-all;
      }
      .control-row .input {
        width: 100%;
        flex: 1 1 100%;
      }
      .control-row .btn {
        flex: 1 1 calc(50% - 4px);
        min-width: 0;
      }
      .danmu-box {
        height: 55vh;
        min-height: 260px;
        max-height: 420px;
      }
      .csv-textarea {
        height: 160px;
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 16px;
      }
      .control-row {
        flex-direction: column;
      }
      .control-row .btn {
        width: 100%;
        flex: 1 1 100%;
      }
      .danmu-box {
        height: 50vh;
      }
      .danmu-item {
        align-items: flex-start;
        flex-wrap: wrap;
        white-space: normal;
        row-gap: 4px;
      }
      .danmu-time {
        min-width: auto;
      }
      .danmu-user-id,
      .danmu-user {
        max-width: 42vw;
      }
      .danmu-content {
        flex: 1 1 100%;
        width: 100%;
        overflow-wrap: anywhere;
      }
      .csv-header {
        flex-wrap: wrap;
        gap: 8px;
      }
      .csv-header > div {
        width: 100%;
        display: flex;
      }
      .csv-header > div .btn {
        flex: 1 1 50%;
      }
    }

    @media (max-width: 375px) {
      body {
        padding: 8px;
      }
      .container {
        padding: 12px;
        border-radius: 10px;
      }
      .title {
        font-size: 16px;
      }
      .btn {
        min-height: 40px;
        padding: 9px 10px;
        font-size: 13px;
      }
      .input {
        font-size: 13px;
        padding: 9px 10px;
      }
      .hint {
        font-size: 11px;
        line-height: 1.5;
      }
      .stats-row {
        gap: 6px;
      }
      .stat-pill {
        font-size: 10px;
        padding: 2px 6px;
      }
      .danmu-box {
        min-height: 220px;
      }
      .danmu-item {
        padding: 4px;
        gap: 6px;
      }
      .danmu-time,
      .danmu-type,
      .danmu-user-id,
      .danmu-user {
        font-size: 10px;
      }
      .danmu-content {
        font-size: 12px;
      }
      .csv-textarea {
        height: 130px;
        font-size: 10px;
      }
      .footer,
      .disclaimer {
        font-size: 10px;
      }
    }

    @media (max-width: 932px) and (orientation: landscape) {
      body {
        padding: 8px;
      }
      .container {
        max-width: 100%;
        padding: 10px 12px;
      }
      .header {
        margin-bottom: 8px;
      }
      .title {
        font-size: 16px;
      }
      .status {
        font-size: 12px;
      }
      .hint {
        display: none;
      }
      .control-row {
        margin-bottom: 8px;
      }
      .control-row .input {
        flex: 1 1 38%;
      }
      .control-row .btn {
        flex: 1 1 auto;
        min-width: 90px;
      }
      .danmu-box {
        height: 62vh;
        min-height: 220px;
      }
      .csv-box {
        margin-top: 8px;
      }
      .csv-textarea {
        height: 110px;
      }
      .disclaimer {
        margin-top: 10px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">抖音直播弹幕抓取系统</h1>
      <div class="header-actions">
        <button id="themeToggleBtn" class="btn btn-ghost">
          切换白天/黑夜
        </button>
        <div class="status" id="statusText">
          <span class="status-dot" id="statusDot"></span>
          等待输入直播间 live_id
        </div>
      </div>
    </div>

    <div class="control-row">
      <input
        id="liveIdInput"
        class="input"
        placeholder="请输入直播间 live_id，例如：261378947940，然后按 Enter 或点击「开始抓取」"
      />
      <button id="startBtn" class="btn btn-primary">开始抓取</button>
      <button id="stopBtn" class="btn btn-secondary" disabled>停止抓取</button>
      <button id="clearBtn" class="btn btn-secondary">清空弹幕</button>
    </div>

    <div class="hint">
      - 按 <code>Enter</code> 相当于点击“开始抓取”<br />
      - “清空弹幕”只清理当前前端显示，不会影响后端采集<br />
      - 5~15秒后，前端会自动获取弹幕消息，无需手动刷新<br />
      - 支持切换白天/黑夜模式<br />
      - 支持下载CSV文件<br />
      - 支持清空弹幕<br />
      - 10分钟没人拉取就自动停止<br />
      - 单次请求最多启动2个直播间(直播号用空格隔开)<br />
    </div>

    <div class="danmu-box">
      <div class="danmu-header">
        <div class="danmu-title">弹幕流</div>
        <div class="danmu-counter">
          共 <span id="danmuCount">0</span> 条
        </div>
      </div>

      <div class="stats-row" id="statsRow">
        <span class="stat-pill">聊天: <span id="statChat">0</span></span>
        <span class="stat-pill">礼物: <span id="statGift">0</span></span>
        <span class="stat-pill">点赞: <span id="statLike">0</span></span>
        <span class="stat-pill">进场: <span id="statEnter">0</span></span>
        <span class="stat-pill">关注: <span id="statFollow">0</span></span>
        <span class="stat-pill">统计: <span id="statStats">0</span></span>
        <span class="stat-pill">直播间: <span id="statRoom">0</span></span>
        <span class="stat-pill">表情: <span id="statEmoji">0</span></span>
      </div>

      <div class="stats-row" id="filterRow">
        <label class="stat-pill">
          <input type="checkbox" data-type="chat" checked /> 聊天
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="gift" checked /> 礼物
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="like" checked /> 点赞
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="enter" checked /> 进场
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="follow" checked /> 关注
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="stats" checked /> 统计
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="room" checked /> 直播间
        </label>
        <label class="stat-pill">
          <input type="checkbox" data-type="emoji" checked /> 表情
        </label>
      </div>

      <div id="danmuList" class="danmu-list"></div>
    </div>

    <div class="csv-box">
      <div class="csv-header">
        <span>CSV 视图</span>
        <div style="display: flex; gap: 8px">
          <button id="copyCsvBtn" class="btn btn-secondary">复制 CSV</button>
          <button id="downloadCsvBtn" class="btn btn-secondary">下载 CSV</button>
        </div>
      </div>
      <textarea id="csvView" class="csv-textarea" readonly></textarea>
    </div>

    <div class="footer">
      终端运行结果中的弹幕消息已实时映射到本页面显示。
    </div>

    <div class="disclaimer">
      <strong>⚠️ ：</strong>所有数据来源于抖音公开数据。
    </div>
